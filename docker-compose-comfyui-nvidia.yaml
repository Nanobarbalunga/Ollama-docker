services:
  comfyui:
    profiles:
      - images
    image: ${COMFYUI_NVIDIA_IMAGE:-ghcr.io/ai-dock/comfyui:latest-cuda}
    container_name: ${COMFYUI_CONTAINER_NAME:-comfyui}
    pull_policy: ${COMFYUI_PULL_POLICY:-always}
    restart: ${COMFYUI_RESTART_POLICY:-unless-stopped}
    ports:
      - "${COMFYUI_HOST_BIND:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ${COMFYUI_DATA_PATH:-./comfyui}:/workspace
    environment:
      AUTO_UPDATE: ${COMFYUI_AUTO_UPDATE:-false}
      COMFYUI_ARGS: ${COMFYUI_NVIDIA_ARGS:---listen 0.0.0.0}
      NVIDIA_VISIBLE_DEVICES: ${COMFYUI_NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${COMFYUI_NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      WEB_ENABLE_AUTH: ${COMFYUI_WEB_ENABLE_AUTH:-false}
      WORKSPACE: /workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COMFYUI_NVIDIA_GPU_COUNT:-1}
              capabilities: [gpu]
    networks:
      - ollama-docker

networks:
  ollama-docker:
    name: ollama-docker
