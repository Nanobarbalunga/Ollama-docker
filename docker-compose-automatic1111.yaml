services:
  automatic1111:
    profiles:
      - automatic1111
    image: ${AUTOMATIC1111_CPU_IMAGE:-ghcr.io/ai-dock/stable-diffusion-webui:latest-cpu}
    container_name: ${AUTOMATIC1111_CONTAINER_NAME:-automatic1111}
    pull_policy: ${AUTOMATIC1111_PULL_POLICY:-always}
    restart: ${AUTOMATIC1111_RESTART_POLICY:-unless-stopped}
    ports:
      - "${AUTOMATIC1111_HOST_BIND:-127.0.0.1}:${AUTOMATIC1111_PORT:-7860}:7860"
    volumes:
      - ${AUTOMATIC1111_DATA_PATH:-./automatic1111}:/workspace
    environment:
      AUTO_UPDATE: ${AUTOMATIC1111_AUTO_UPDATE:-false}
      WEBUI_ARGS: ${AUTOMATIC1111_CPU_ARGS:---listen --api --use-cpu all --precision full --no-half --skip-torch-cuda-test}
      WEB_ENABLE_AUTH: ${AUTOMATIC1111_WEB_ENABLE_AUTH:-false}
      WORKSPACE: /workspace
    networks:
      - ollama-docker

networks:
  ollama-docker:
    name: ollama-docker
